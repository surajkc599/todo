<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>List Page - Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    input { font: inherit; }
    input::placeholder { color: #cbd5e1; }
  </style>
</head>
<body>
<div style="width: 100%; min-height: 100vh; background: #f8fafc; padding: 24px;">
  <div style="max-width: 600px; margin: 0 auto;">

    <!-- Header with Share Link -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #e2e8f0;">
      <div>
        <h1 style="font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 4px;">My Grocery List</h1>
        <p style="font-size: 12px; color: #64748b; font-family: monospace; word-break: break-all;">List ID: abc123def456</p>
      </div>
      <div style="background: #2563eb; color: white; border: none; padding: 10px 16px; font-size: 13px; font-weight: 600; border-radius: 6px; white-space: nowrap; text-align: center;">
        Share
      </div>
    </div>

    <!-- Add Item Form -->
    <div style="background: white; border-radius: 8px; padding: 16px; margin-bottom: 24px; border: 1px solid #e2e8f0; display: flex; gap: 12px;">
      <input type="text" placeholder="Add a new item..." style="flex: 1; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px;" />
      <input type="number" placeholder="Price" style="width: 80px; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px;" />
      <div style="background: #10b981; color: white; border: none; padding: 10px 16px; font-weight: 600; border-radius: 6px; font-size: 14px; text-align: center;">
        Add
      </div>
    </div>

    <!-- Todo Items List -->
    <div style="display: flex; flex-direction: column; gap: 8px;">

      <!-- Item 1: Completed -->
      <div style="background: white; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px; opacity: 0.6;">
        <input type="checkbox" checked style="width: 20px; height: 20px;" />
        <div style="flex: 1; min-width: 0;">
          <p style="font-size: 14px; color: #64748b; text-decoration: line-through;">Milk</p>
        </div>
        <span style="font-size: 13px; color: #94a3b8; font-weight: 500;">$3.50</span>
        <div style="background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 4px; text-align: center; width: 28px;">×</div>
      </div>

      <!-- Item 2: Active -->
      <div style="background: white; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px;">
        <input type="checkbox" style="width: 20px; height: 20px;" />
        <div style="flex: 1; min-width: 0;">
          <p style="font-size: 14px; color: #0f172a; font-weight: 500;">Bread</p>
        </div>
        <span style="font-size: 13px; color: #475569; font-weight: 500;">$2.80</span>
        <div style="background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 4px; text-align: center; width: 28px;">×</div>
      </div>

      <!-- Item 3: Active -->
      <div style="background: white; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px;">
        <input type="checkbox" style="width: 20px; height: 20px;" />
        <div style="flex: 1; min-width: 0;">
          <p style="font-size: 14px; color: #0f172a; font-weight: 500;">Eggs (12)</p>
        </div>
        <span style="font-size: 13px; color: #475569; font-weight: 500;">$4.20</span>
        <div style="background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 4px; text-align: center; width: 28px;">×</div>
      </div>

      <!-- Item 4: Active -->
      <div style="background: white; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px;">
        <input type="checkbox" style="width: 20px; height: 20px;" />
        <div style="flex: 1; min-width: 0;">
          <p style="font-size: 14px; color: #0f172a; font-weight: 500;">Cheese</p>
        </div>
        <span style="font-size: 13px; color: #475569; font-weight: 500;">$6.50</span>
        <div style="background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 4px; text-align: center; width: 28px;">×</div>
      </div>

    </div>

    <!-- Total Cost Footer -->
    <div style="background: white; border-radius: 8px; padding: 20px; margin-top: 24px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 4px;">Total Cost</p>
        <p style="font-size: 28px; font-weight: 700; color: #0f172a;">$17.00</p>
      </div>
      <div style="text-align: right;">
        <p style="font-size: 13px; color: #64748b;">3 of 4 done</p>
        <div style="width: 120px; height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 8px; overflow: hidden;">
          <div style="width: 75%; height: 100%; background: #10b981;"></div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
