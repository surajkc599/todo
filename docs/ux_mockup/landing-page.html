<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Landing Page - Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
<div style="width: 100%; height: 100vh; background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 32px;">
  <!-- Header -->
  <div style="text-align: center;">
    <h1 style="font-size: 48px; font-weight: 700; color: #0f172a; margin-bottom: 12px;">Shared Todo</h1>
    <p style="font-size: 18px; color: #475569; line-height: 1.5;">Create a list, share the link, collaborate with family</p>
  </div>

  <!-- Main CTA Button -->
  <div style="background: #2563eb; color: white; border: none; padding: 16px 48px; font-size: 18px; font-weight: 600; border-radius: 8px; min-width: 280px; text-align: center;">
    Create New List
  </div>

  <!-- Features Grid -->
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 64px; max-width: 900px;">
    <div style="text-align: center;">
      <div style="font-size: 40px; margin-bottom: 16px;">🔗</div>
      <h3 style="font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Share Instantly</h3>
      <p style="font-size: 14px; color: #64748b; line-height: 1.5;">Share a link with anyone. No signup needed.</p>
    </div>
    <div style="text-align: center;">
      <div style="font-size: 40px; margin-bottom: 16px;">💾</div>
      <h3 style="font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Never Lose Data</h3>
      <p style="font-size: 14px; color: #64748b; line-height: 1.5;">Everything is saved automatically.</p>
    </div>
    <div style="text-align: center;">
      <div style="font-size: 40px; margin-bottom: 16px;">💰</div>
      <h3 style="font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Track Costs</h3>
      <p style="font-size: 14px; color: #64748b; line-height: 1.5;">Add prices and see your total.</p>
    </div>
  </div>
</div>
</body>
</html>
